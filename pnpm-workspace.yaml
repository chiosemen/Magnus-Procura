packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/*/*'
allowBuilds:
  esbuild: true

# Transitive security overrides.
# postcss <=8.5.17 is vulnerable to arbitrary file read and path traversal via
# attacker-controlled sourceMappingURL (GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849)
# and reaches us through next. An earlier attempt at this used npm's top-level
# `overrides` field, which pnpm does not read, so it never applied.
overrides:
  postcss: '>=8.5.18'
