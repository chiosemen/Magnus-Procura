name: Monorepo CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (Strict TypeScript across all workspaces)
        run: pnpm typecheck

      - name: Run test suites (packages/db & apps/api)
        run: pnpm test

      - name: Automated Invariant Checks
        run: pnpm test:invariants

      - name: Production build (apps/web, apps/api, packages/db)
        run: pnpm build
